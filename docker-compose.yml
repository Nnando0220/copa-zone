services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copazone}
      POSTGRES_USER: ${POSTGRES_USER:-copazone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copazone_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copazone -d copazone"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./copa-zone-backend
    env_file:
      - ./copa-zone-backend/.env.docker
    environment:
      APP_NAME: CopaZone
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: copazone
      DB_USERNAME: copazone
      SESSION_DRIVER: database
      SESSION_DOMAIN: ""
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173,localhost:5173
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    ports:
      - "8000:8000"
    volumes:
      - ./copa-zone-backend:/var/www/html
      - ./copa-zone-backend/.env.docker:/var/www/html/.env:ro
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ./copa-zone-backend
    env_file:
      - ./copa-zone-backend/.env.docker
    environment:
      APP_NAME: CopaZone
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: copazone
      DB_USERNAME: copazone
      SESSION_DRIVER: database
      SESSION_DOMAIN: ""
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173,localhost:5173
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - ./copa-zone-backend:/var/www/html
      - ./copa-zone-backend/.env.docker:/var/www/html/.env:ro
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan schedule:work

  reverb:
    build:
      context: ./copa-zone-backend
    env_file:
      - ./copa-zone-backend/.env.docker
    environment:
      APP_NAME: CopaZone
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: copazone
      DB_USERNAME: copazone
      SESSION_DRIVER: database
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173,localhost:5173
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    ports:
      - "8080:8080"
    volumes:
      - ./copa-zone-backend:/var/www/html
      - ./copa-zone-backend/.env.docker:/var/www/html/.env:ro
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  frontend:
    build:
      context: ./copa-zone-frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "true"
      VITE_REVERB_APP_KEY: copazone-local-key
      VITE_REVERB_HOST: 127.0.0.1
      VITE_REVERB_PORT: "8080"
      VITE_REVERB_SCHEME: http
    ports:
      - "5173:5173"
    volumes:
      - ./copa-zone-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "if [ ! -d node_modules/vite ] || [ ! -d node_modules/laravel-echo ] || [ ! -d node_modules/pusher-js ] || [ ! -d node_modules/gsap ]; then npm install --include=dev; fi && npm run dev -- --host 0.0.0.0 --port 5173 --force"

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
