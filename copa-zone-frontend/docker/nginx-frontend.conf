map $http_x_forwarded_proto $copazone_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $request_uri $copazone_robots_header {
    default "noindex, nofollow";

    ~^/(?:\?.*)?$ "index, follow";
    ~^/como-funciona/?(?:\?.*)?$ "index, follow";
    ~^/copa-do-mundo-2026/?(?:\?.*)?$ "index, follow";
    ~^/regras/?(?:\?.*)?$ "index, follow";
    ~^/faq/?(?:\?.*)?$ "index, follow";
    ~^/sobre-o-copazone/?(?:\?.*)?$ "index, follow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag $copazone_robots_header always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $copazone_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /sanctum/ {
        proxy_pass http://backend-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $copazone_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /broadcasting/ {
        proxy_pass http://backend-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $copazone_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /up {
        proxy_pass http://backend-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $copazone_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $copazone_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /storage/ {
        proxy_pass http://backend-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $copazone_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
